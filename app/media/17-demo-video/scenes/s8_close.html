<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Halomark demo · s8_close</title>
<link rel="stylesheet" href="shared.css">
<style>
  .lock { position: absolute; left: 96px; top: 120px; }
  .lock .mk { width: 230px; height: 230px; display: block; }
  .lock .wm { font-size: 196px; margin-top: 64px; margin-left: -8px; }
  .lock .tg { font-size: 62px; font-weight: 700; letter-spacing: -.025em; margin-top: 54px; }
  .lock .tg span { display: inline-block; }
  .fine { position: absolute; left: 96px; top: 772px; width: 1728px; border-top: 3px solid var(--ink); padding-top: 24px; display: flex; justify-content: space-between; align-items: baseline; }
  .fine p { font-size: 27px; color: var(--ink-2); font-weight: 500; }
  .fine p.r { color: var(--muted); }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="lock">
    <svg class="mk" id="mk" data-mark></svg>
    <div class="wm" data-wordmark></div>
    <div class="tg"><span>Calibrated odds</span> <span>for angels.</span></div>
  </div>
  <div class="fine" id="fine">
    <p id="f1">Screening aid, not investment advice.</p>
    <p class="r" id="f2">Built with TRL (Vela Research), Kev, Claude and ElevenLabs.</p>
  </div>
</div>
<script src="data.js"></script>
<script src="seek.js"></script>
<script>
HM.scene({
  id: 's8_close', duration: 8.8, voiceAt: 0.5,
  build: function (HM) {
    HM.strike('#mk', 0.55, { from: 1.9, dur: 0.18 });       // "Halomark."
    HM.jolt('#stage', 0.55, 7);
    HM.set('.lock .wl', 0.7, { dy: 70, dur: 0.4, stagger: 0.045 });
    HM.set('.lock .tg span', 1.45, { dy: 30, dur: 0.45, stagger: 1.0 });   // "Calibrated odds / for angels"
    HM.wipe('#fine', 3.3, { dur: 0.6 });                     // "A screening aid, not investment advice"
    HM.fade('#f1', 3.5, { dur: 0.4 });
    HM.fade('#f2', 5.6, { dur: 0.5 });
  }
});
</script>
</body>
</html>

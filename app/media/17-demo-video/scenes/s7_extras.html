<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Halomark demo · s7_extras</title>
<link rel="stylesheet" href="shared.css">
<style>
  .items { position: absolute; left: 96px; top: 236px; width: 850px; border-bottom: 3px solid var(--ink); }
  .items li { position: relative; display: flex; align-items: center; gap: 34px; height: 146px; border-top: 3px solid var(--ink); }
  .items .n { font-size: 84px; width: 84px; flex: none; color: var(--brand); }
  .items .t { font-size: 50px; font-weight: 800; letter-spacing: -.035em; line-height: 1; }
  .items .on { position: absolute; left: 0; right: 0; top: 0; bottom: 0; background: var(--brand-soft); z-index: -1; margin: 0 -20px; }
</style>
</head>
<body>
<div class="stage">
  <div class="head short" id="head"><span data-wordmark></span><span class="folio" id="folio"><b>07</b> &nbsp;Also in the app</span></div>
  <div class="left" id="left">
    <div class="col"><div class="eyebrow" id="eb">Also in the app</div></div>
    <ul class="items">
      <li><i class="on"></i><span class="figure n">1</span><span class="t">Screen a list</span></li>
      <li><i class="on"></i><span class="figure n">2</span><span class="t">Voice notes</span></li>
      <li><i class="on"></i><span class="figure n">3</span><span class="t">Notified when it's done</span></li>
      <li><i class="on"></i><span class="figure n">4</span><span class="t">Your profile stays on your phone</span></li>
    </ul>
  </div>
  <div id="phone-slot"></div>
</div>
<script src="data.js"></script>
<script src="seek.js"></script>
<script>
HM.scene({
  id: 's7_extras', duration: 12.7, voiceAt: 0.7,
  clips: [{ name: 'c7_list', from: 1.9, to: 4.2 }, { name: 'c8_voice', from: 4.2, to: 7.4 },
          { name: 'c9_notify', from: 7.4, to: 9.6 }, { name: 'c10_profile', from: 9.6, to: 12.7 }],
  build: function (HM) {
    // s6 ended on a sheet of paper: the head is set and the phone comes back in ("Back in the app")
    HM.wipe('#head', 0.1, { dur: 0.45, out: 12.15 });
    HM.tl('#phone', [[0.1, { transform: 'translateY(1100px)' }, 'set'], [0.85, { transform: 'translateY(0px)' }],
                     [12.1, { transform: 'translateY(0px)' }, 'cubic-bezier(.6,0,.9,.4)'], [12.6, { transform: 'translateY(1100px)' }]]);
    HM.fade('#eb', 0.4);
    HM.wipe('.items', 0.9, { dur: 0.5 });
    var li = document.querySelectorAll('.items li'), on = document.querySelectorAll('.items .on');
    var at = [2.45, 4.55, 7.05, 9.6], cut = [1.9, 4.2, 7.4, 9.6];
    at.forEach(function (t, i) {
      HM.set([li[i].children[1], li[i].children[2]], t, { dy: 30, dur: 0.4, stagger: 0.05 });
      // the highlight sits on the feature the phone is showing
      var f = [[cut[i], { clipPath: 'inset(0 100% 0 0)' }, 'inout'], [cut[i] + 0.35, { clipPath: 'inset(0 0 0 0)' }]];
      if (i < 3) { f.push([cut[i + 1], { clipPath: 'inset(0 0 0 0)' }, 'inout']); f.push([cut[i + 1] + 0.3, { clipPath: 'inset(0 0 0 100%)' }]); }
      HM.tl(on[i], f);
    });
    HM.zoom([{ at: 5.7, until: 6.85, y: 620 }], { tin: 0.7, tout: 0.55 });   // the voice note: "Filled in: Technical · 10-15 years ..."
    HM.out('#left', 12.1, { dur: 0.42 });                                   // everything leaves; s8 opens on plain paper
  }
});
</script>
</body>
</html>
